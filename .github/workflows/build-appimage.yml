name: Build and Publish AppImage

on:
  push:
    tags:
      - '*build*'
      - 'build*'
      - 'v*build*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-appindicator3-0.1 \
            libgirepository1.0-dev \
            zsync \
            wget \
            squashfs-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests watchdog cryptography psutil Pillow urllib3 charset-normalizer idna certifi cffi pycparser

      - name: Compute Build Version
        id: versioning
        run: |
          BASE_VER=$(grep -oE 'VERSION="\$\{VERSION:-[^"]+\}"' build/build_appimage.sh | sed 's/.*:-//; s/}"//' || echo "1.6")
          if [ -z "$BASE_VER" ]; then
            BASE_VER="1.6"
          fi
          
          DATE_STR=$(date -u +%Y-%m-%d)
          BUILD_NUM="${GITHUB_RUN_NUMBER}"
          
          # Version format: app_version-yyyy-mm-dd-build_number
          FULL_VERSION="${BASE_VER}-${DATE_STR}-${BUILD_NUM}"
          
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "Computed build version: ${FULL_VERSION}"

      - name: Build AppImage
        env:
          VERSION: ${{ env.FULL_VERSION }}
          ALLOW_DIRTY_ENGINE: 1
        run: |
          chmod +x build/build_appimage.sh
          bash build/build_appimage.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RomM-RetroArch-Sync-AppImage-${{ env.FULL_VERSION }}
          path: |
            build/*.AppImage
            build/*.zsync

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ env.FULL_VERSION }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            build/*.AppImage
            build/*.zsync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

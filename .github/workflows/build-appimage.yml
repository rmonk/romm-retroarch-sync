name: Build and Publish AppImage

on:
  push:
    branches:
      - main
    tags:
      - '*build*'
      - 'build*'
      - 'v*build*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release for this manual run'
        required: true
        type: boolean
        default: true
      tag_name:
        description: 'Custom tag name for manual release (leave empty for auto-generated v1.7-yyyy-mm-dd-build_number)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-appindicator3-0.1 \
            libgirepository1.0-dev \
            zsync \
            wget \
            squashfs-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests watchdog cryptography psutil Pillow urllib3 charset-normalizer idna certifi cffi pycparser

      - name: Compute Build Version
        id: versioning
        run: |
          BASE_VER=$(grep -oE 'VERSION="\$\{VERSION:-[^"]+\}"' build/build_appimage.sh | sed 's/.*:-//; s/}"//' || echo "1.6")
          if [ -z "$BASE_VER" ]; then
            BASE_VER="1.7"
          fi
          
          DATE_STR=$(date -u +%Y-%m-%d)
          BUILD_NUM="${GITHUB_RUN_NUMBER}"
          
          # Version format: app_version-yyyy-mm-dd-build_number
          FULL_VERSION="${BASE_VER}-${DATE_STR}-${BUILD_NUM}"
          
          # Determine release tag name
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.tag_name }}"
            if [ -z "$RELEASE_TAG" ]; then
              RELEASE_TAG="v${FULL_VERSION}"
            fi
          elif [ "${{ github.ref_type }}" = "branch" ]; then
            RELEASE_TAG="v${FULL_VERSION}"
          else
            RELEASE_TAG="${{ github.ref_name }}"
          fi

          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "Computed build version: ${FULL_VERSION}"
          echo "Computed release tag: ${RELEASE_TAG}"

      - name: Build AppImage
        env:
          VERSION: ${{ env.FULL_VERSION }}
          ALLOW_DIRTY_ENGINE: 1
        run: |
          chmod +x build/build_appimage.sh
          bash build/build_appimage.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RomM-RetroArch-Sync-AppImage-${{ env.FULL_VERSION }}
          path: |
            build/*.AppImage
            build/*.zsync

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.create_release != false)
        with:
          name: Release ${{ env.FULL_VERSION }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          files: |
            build/*.AppImage
            build/*.zsync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
